<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#010E22">
<title>SmartPack messestyring</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;background:#010E22;color:#F1F5F9;
    font-family:'Inter Tight','Inter',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
    -webkit-font-smoothing:antialiased}
  body{padding:0 0 48px}
  .ark{max-width:560px;margin:0 auto;padding:0 18px}

  header{display:flex;align-items:center;gap:12px;padding:22px 0 18px}
  header img{width:140px;display:block}
  header .t{font-size:14px;color:#94A3B8;border-left:1px solid rgba(241,245,249,.16);
            padding-left:12px;line-height:1.3}

  .kasse{background:#161C24;border:1px solid rgba(241,245,249,.08);
         border-radius:16px;padding:18px;margin-bottom:14px}
  h2{font-size:12px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;
     color:#94A3B8;margin:0 0 12px}

  /* kodelaas */
  #laas{display:none}
  #laas.vis{display:block}
  #app{display:none}
  #app.vis{display:block}
  input[type=password],input[type=text]{width:100%;background:#0B1220;
    border:1.5px solid rgba(241,245,249,.12);border-radius:11px;color:#F1F5F9;
    font-family:inherit;font-size:16px;padding:14px;outline:none}
  input:focus{border-color:#3ECF8E}
  .knap{display:block;width:100%;border:0;border-radius:12px;background:#3ECF8E;
        color:#010E22;font-family:inherit;font-size:16px;font-weight:600;
        padding:15px;margin-top:12px;cursor:pointer}
  .knap:active{transform:translateY(1px)}
  .knap.rod{background:#F97316;color:#010E22}
  .knap.tom{background:transparent;color:#94A3B8;border:1.5px solid rgba(241,245,249,.14)}
  .fejl{display:none;color:#F97316;font-size:14px;margin-top:10px}
  .fejl.vis{display:block}

  /* spiller nu */
  #nu{display:flex;align-items:center;gap:12px}
  #prik{width:10px;height:10px;border-radius:50%;background:#334155;flex:0 0 auto}
  #prik.live{background:#3ECF8E;box-shadow:0 0 0 0 rgba(62,207,142,.6);
             animation:puls 1.8s ease-out infinite}
  @keyframes puls{to{box-shadow:0 0 0 12px rgba(62,207,142,0)}}
  #nunavn{font-size:19px;font-weight:700;letter-spacing:-.01em}
  #nuund{font-size:13px;color:#94A3B8;margin-top:2px}

  /* liste */
  .rk{display:flex;align-items:center;gap:12px;width:100%;text-align:left;
      background:#0B1220;border:1.5px solid rgba(241,245,249,.10);border-radius:12px;
      color:#F1F5F9;font-family:inherit;padding:13px 14px;margin-bottom:8px;cursor:pointer}
  .rk:last-child{margin-bottom:0}
  .rk:active{border-color:#3ECF8E}
  .rk.koerer{border-color:#3ECF8E;background:rgba(62,207,142,.10)}
  .rk .nv{font-size:16px;font-weight:600;flex:1;min-width:0;
          white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .rk .br{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:#64748B;
          margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .rk .tal{font-size:13px;color:#94A3B8;flex:0 0 auto;text-align:right;line-height:1.25}
  .rk .tal b{display:block;font-size:17px;color:#F1F5F9;font-weight:700}
  .mus{color:#3ECF8E !important}

  .gitter{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .tal2{background:#0B1220;border:1px solid rgba(241,245,249,.08);
        border-radius:12px;padding:14px}
  .tal2 .v{font-size:28px;font-weight:700;letter-spacing:-.02em;line-height:1}
  .tal2 .n{font-size:12px;color:#94A3B8;margin-top:5px}
  .tal2 .d{font-size:12px;color:#3ECF8E;margin-top:3px}

  .koe{font-size:14px;color:#94A3B8;line-height:1.5}
  .koe b{color:#F1F5F9;font-weight:600}
  footer{text-align:center;font-size:12px;color:#475569;padding:18px 0 0}
</style>
</head>

      <h2>P&aring; v&aelig;ggen lige nu</h2>
      <div id="nu">
        <div id="prik"></div>
        <div style="flex:1;min-width:0">
          <div id="nunavn">Den store pr&aelig;sentation</div>
          <div id="nuund">Ingen case i gang</div>
        </div>
      </div>
      <button class="knap rod" id="stop">Tilbage til pr&aelig;sentationen</button>
      <div class="koe" id="koetxt" style="margin-top:12px"></div>
    </div>

    <div class="kasse">
      <h2>Tal</h2>
      <div class="gitter">
        <div class="tal2"><div class="v" id="t_scan">0</div>
          <div class="n">scanninger i alt</div><div class="d" id="t_scan_dag">0 i dag</div></div>
        <div class="tal2"><div class="v" id="t_lead">0</div>
          <div class="n">sendte formularer</div><div class="d" id="t_lead_dag">0 i dag</div></div>
      </div>
    </div>

    <div class="kasse">
      <h2>Kundecases &mdash; tryk for at spille</h2>
      <div id="cases"></div>
    </div>

    <div class="kasse">
      <h2>SmartPack-bangers</h2>
      <div id="bangers"></div>
    </div>

    <button class="knap tom" id="glem">Glem koden p&aring; denne telefon</button>
    <footer id="opdat">&nbsp;</footer>
  </div>

</div>
<script>
var LISTE = [{"id": "danfilter", "navn": "Danfilter", "branche": "Produktion og webshop", "musik": false}, {"id": "sygeplejebutikken", "navn": "Sygeplejebutikken", "branche": "Sundhed", "musik": false}, {"id": "skagen-clothing", "navn": "Skagen Clothing", "branche": "Tøj", "musik": false}, {"id": "uniq-perler", "navn": "Uniq Perler", "branche": "Hobby", "musik": false}, {"id": "luksushund", "navn": "Luksushund", "branche": "Kæledyr", "musik": false}, {"id": "firstgrade", "navn": "FirstGrade", "branche": "", "musik": false}, {"id": "vinhuset", "navn": "Vinhuset.dk", "branche": "Vin", "musik": false}, {"id": "create2stay", "navn": "create2STAY", "branche": "", "musik": false}, {"id": "totteland", "navn": "Totteland.dk", "branche": "Hundeejere", "musik": false}, {"id": "littleunbox", "navn": "LittleUnBox", "branche": "Abonnement", "musik": false}, {"id": "den-sidste-flaske", "navn": "Den Sidste Flaske", "branche": "Vin", "musik": false}, {"id": "jule-sweaters", "navn": "Jule-Sweaters", "branche": "Tøj", "musik": false}, {"id": "billigfitness", "navn": "Billigfitness", "branche": "Fitness", "musik": false}, {"id": "banger-dit-lager", "navn": "Dit Lager Part II", "branche": "3:32", "musik": true}, {"id": "banger-halloween", "navn": "Halloween er død", "branche": "3:05", "musik": true}, {"id": "banger-hero", "navn": "Your Warehouse Hero", "branche": "3:19", "musik": true}];
var API = '/api/spil';
var kode = null;

function g(id){ return document.getElementById(id); }
function hent(sti, valg){
  valg = valg || {};
  valg.cache = 'no-store';
  valg.headers = Object.assign({'x-messe-kode': kode || ''}, valg.headers || {});
  return fetch(API + sti, valg).then(function(r){
    if (r.status === 401) { laasUd(); return Promise.reject('kode'); }
    return r.json();
  });
}
function send(krop){
  return hent('/messe/ordre', {
    method: 'POST',
    headers: {'Content-Type':'application/json'},
    body: JSON.stringify(krop)
  });
}

/* ---- kodelaas ---- */
function laasOp(k){
  kode = k;
  try { localStorage.setItem('messekode', k); } catch(e){}
  g('laas').classList.remove('vis');
  g('app').classList.add('vis');
  opdater();
}
function laasUd(){
  kode = null;
  try { localStorage.removeItem('messekode'); } catch(e){}
  g('app').classList.remove('vis');
  g('laas').classList.add('vis');
}
g('laasop').addEventListener('click', function(){
  var k = g('kode').value;
  if (!k) return;
  kode = k;
  hent('/messe/nu').then(function(){ laasOp(k); })
    .catch(function(){ kode = null; g('laasfejl').classList.add('vis'); });
});
g('kode').addEventListener('keydown', function(e){ if (e.key === 'Enter') g('laasop').click(); });
g('kode').addEventListener('input', function(){ g('laasfejl').classList.remove('vis'); });
g('glem').addEventListener('click', laasUd);

/* ---- listerne ---- */
function raekke(c){
  var b = document.createElement('button');
  b.className = 'rk'; b.dataset.id = c.id;
  b.innerHTML =
    '<div style="flex:1;min-width:0">' +
      '<div class="nv">' + c.navn + '</div>' +
      '<div class="br' + (c.musik ? ' mus' : '') + '">' + (c.branche || '&nbsp;') + '</div>' +
    '</div>' +
    '<div class="tal"><b data-tal="' + c.id + '">0</b>scan</div>';
  b.addEventListener('click', function(){
    send({ case: c.id }).then(opdater).catch(function(){});
  });
  return b;
}
(function byg(){
  var a = g('cases'), m = g('bangers');
  LISTE.forEach(function(c){ (c.musik ? m : a).appendChild(raekke(c)); });
})();

g('stop').addEventListener('click', function(){
  send({ stop: true }).then(opdater).catch(function(){});
});

/* ---- opdatering ---- */
function opdater(){
  if (!kode) return;
  hent('/messe/nu').then(function(d){
    var navn = d.spiller ? d.navn : '';
    g('nunavn').textContent = navn || 'Den store præsentation';
    g('nuund').textContent = d.spiller ? 'Spiller på væggen' :
      (d.venter ? 'Ordre på vej…' : 'Ingen case i gang');
    g('prik').className = d.spiller ? 'live' : '';
    [].slice.call(document.querySelectorAll('.rk')).forEach(function(e){
      e.classList.toggle('koerer', e.dataset.id === d.spiller);
    });
    var k = d.koe || [];
    g('koetxt').innerHTML = k.length
      ? 'I kø fra gæsternes scan: <b>' + k.map(function(x){ return x.navn || x.case; }).join('</b>, <b>') + '</b>'
      : 'Ingen i kø fra gæsternes scan.';
  }).catch(function(){});

  hent('/messe/stat').then(function(d){
    g('t_scan').textContent = d.scan_i_alt || 0;
    g('t_scan_dag').textContent = (d.scan_i_dag || 0) + ' i dag';
    g('t_lead').textContent = d.lead || 0;
    g('t_lead_dag').textContent = (d.lead_i_dag || 0) + ' i dag';
    var pr = {};
    (d.scan || []).forEach(function(x){ pr[x.case] = x.i_alt; });
    [].slice.call(document.querySelectorAll('[data-tal]')).forEach(function(e){
      e.textContent = pr[e.dataset.tal] || 0;
    });
    var n = new Date();
    g('opdat').textContent = 'Opdateret ' +
      ('0'+n.getHours()).slice(-2) + ':' + ('0'+n.getMinutes()).slice(-2) + ':' + ('0'+n.getSeconds()).slice(-2);
  }).catch(function(){});
}
setInterval(opdater, 5000);
document.addEventListener('visibilitychange', function(){ if (!document.hidden) opdater(); });

/* husket kode? */
(function start(){
  var k = null;
  try { k = localStorage.getItem('messekode'); } catch(e){}
  if (!k) { g('laas').classList.add('vis'); return; }
  kode = k;
  hent('/messe/nu').then(function(){ laasOp(k); }).catch(function(){ laasUd(); });
})();
</script>
</body>
</html>
