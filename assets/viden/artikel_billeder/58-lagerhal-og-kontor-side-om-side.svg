<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">Arbejdsdelingen mellem WMS og ERP</title>
  <desc id="d">To felter side om side. Til venstre WMS med lokation, beholdning, pluk, pak, modtagelse og optælling. Til højre ERP med fakturaer, indkøbsordrer, kunder og regnskab. Data løber begge veje imellem dem.</desc>
  <style>
    .txt   { font-family:'Inter',-apple-system,'Segoe UI',sans-serif; fill:#1a1f25; }
    .h     { font-size:21px; font-weight:600; }
    .s     { font-size:17px; fill:#4a5568; }
    .xs    { font-size:14px; fill:#718096; }
    .cap   { font-size:23px; font-weight:600; }
    .sub   { font-size:18px; fill:#4a5568; }
    .card  { fill:#ffffff; }
    .pane  { fill:#f0f4f2; }
    .box   { fill:#e6d8bd; stroke:#c2ad89; stroke-width:2; }
    .tape  { fill:#cdbb9b; }
    .node  { fill:#f5f7f6; stroke:#c3d2cb; stroke-width:2; }
    .gfill { fill:#1a8a5a; }
    .gtxt  { fill:#1a8a5a; }
    .gstk  { stroke:#1a8a5a; fill:none; }
    .grey  { stroke:#9aa7b0; fill:none; }
    .white { fill:#ffffff; }

    .sy{animation:sy 3.6s ease-in-out infinite}
    @keyframes sy{0%{transform:translateX(0)}50%{transform:translateX(126px)}100%{transform:translateX(0)}}

    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <rect class="card" x="0" y="0" width="960" height="420" rx="16"/>
  <rect class="pane" x="50" y="60" width="330" height="236" rx="10"/>
  <rect class="pane" x="580" y="60" width="330" height="236" rx="10"/>
  <text class="txt h gtxt" x="215" y="94" text-anchor="middle">WMS</text>
  <text class="txt s" x="215" y="118" text-anchor="middle">Hvor varen er</text>
  <text class="txt h" x="745" y="94" text-anchor="middle">ERP</text>
  <text class="txt s" x="745" y="118" text-anchor="middle">Hvad den koster</text>
  <text class="txt s" x="86" y="156">Lokation og beholdning</text>
  <text class="txt s" x="86" y="188">Pluk og pak</text>
  <text class="txt s" x="86" y="220">Modtagelse</text>
  <text class="txt s" x="86" y="252">Optælling</text>
  <text class="txt s" x="616" y="156">Fakturaer og bogføring</text>
  <text class="txt s" x="616" y="188">Indkøbsordrer</text>
  <text class="txt s" x="616" y="220">Kunder og priser</text>
  <text class="txt s" x="616" y="252">Regnskab</text>
  <path d="M392 150 L566 150 M392 206 L566 206" stroke="#e3e9e6" stroke-width="3" fill="none"/>
  <circle class="sy gfill" cx="398" cy="150" r="7"/>
  <circle class="sy" style="animation-direction:reverse" cx="398" cy="206" r="7" fill="#9aa7b0"/>
  <text class="txt xs" x="479" y="250" text-anchor="middle">De deler data</text>
  <text class="txt xs" x="479" y="268" text-anchor="middle">begge veje</text>
  <text class="txt cap" x="480" y="336" text-anchor="middle">WMS og ERP laver ikke det samme</text>
  <text class="txt sub" x="480" y="366" text-anchor="middle">Det ene ved hvor varen står. Det andet ved hvad den er værd. De skal tale sammen, ikke erstatte hinanden</text>
</svg>