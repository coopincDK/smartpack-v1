<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">De fem nøgletal på lageret</title>
  <desc id="d">Fem kort ved siden af hinanden: pakkefejlsprocent, returprocent, pluk pr. time, gennemløbstid og bundet lager i langsomme varer. Hvert kort viser sin formel.</desc>
  <style>
    .txt   { font-family:'Inter',-apple-system,'Segoe UI',sans-serif; fill:#1a1f25; }
    .h     { font-size:21px; font-weight:600; }
    .s     { font-size:17px; fill:#4a5568; }
    .xs    { font-size:14px; fill:#718096; }
    .cap   { font-size:23px; font-weight:600; }
    .sub   { font-size:18px; fill:#4a5568; }
    .card  { fill:#ffffff; }
    .pane  { fill:#f0f4f2; }
    .box   { fill:#e6d8bd; stroke:#c2ad89; stroke-width:2; }
    .tape  { fill:#cdbb9b; }
    .node  { fill:#f5f7f6; stroke:#c3d2cb; stroke-width:2; }
    .gfill { fill:#1a8a5a; }
    .gtxt  { fill:#1a8a5a; }
    .gstk  { stroke:#1a8a5a; fill:none; }
    .grey  { stroke:#9aa7b0; fill:none; }
    .white { fill:#ffffff; }

    .k{animation:k 10s linear infinite}
    @keyframes k{0%,8%{stroke:#1a8a5a}12%,100%{stroke:#c3d2cb}}

    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <rect class="card" x="0" y="0" width="960" height="420" rx="16"/>
  <rect class="k" style="animation-delay:0s" x="44" y="92" width="164" height="118" rx="10" fill="#f5f7f6" stroke="#c3d2cb" stroke-width="2"/>
  <text class="txt h" x="126" y="128" text-anchor="middle">Pakkefejl</text>
  <path d="M80 146 L172 146" stroke="#c3d2cb" stroke-width="2"/>
  <text class="txt xs" x="126" y="176" text-anchor="middle">fejlordrer ÷ sendte</text>
  <text class="txt xs" x="126" y="194" text-anchor="middle">× 100</text>
  <rect class="k" style="animation-delay:2s" x="224" y="92" width="164" height="118" rx="10" fill="#f5f7f6" stroke="#c3d2cb" stroke-width="2"/>
  <text class="txt h" x="306" y="128" text-anchor="middle">Retur</text>
  <path d="M260 146 L352 146" stroke="#c3d2cb" stroke-width="2"/>
  <text class="txt xs" x="306" y="176" text-anchor="middle">returordrer ÷ sendte</text>
  <text class="txt xs" x="306" y="194" text-anchor="middle">× 100</text>
  <rect class="k" style="animation-delay:4s" x="404" y="92" width="164" height="118" rx="10" fill="#f5f7f6" stroke="#c3d2cb" stroke-width="2"/>
  <text class="txt h" x="486" y="128" text-anchor="middle">Pluk pr. time</text>
  <path d="M440 146 L532 146" stroke="#c3d2cb" stroke-width="2"/>
  <text class="txt xs" x="486" y="176" text-anchor="middle">plukkede linjer ÷</text>
  <text class="txt xs" x="486" y="194" text-anchor="middle">timer</text>
  <rect class="k" style="animation-delay:6s" x="584" y="92" width="164" height="118" rx="10" fill="#f5f7f6" stroke="#c3d2cb" stroke-width="2"/>
  <text class="txt h" x="666" y="128" text-anchor="middle">Gennemløbstid</text>
  <path d="M620 146 L712 146" stroke="#c3d2cb" stroke-width="2"/>
  <text class="txt xs" x="666" y="176" text-anchor="middle">fra ordre ind</text>
  <text class="txt xs" x="666" y="194" text-anchor="middle">til pakket</text>
  <rect class="k" style="animation-delay:8s" x="764" y="92" width="164" height="118" rx="10" fill="#f5f7f6" stroke="#c3d2cb" stroke-width="2"/>
  <text class="txt h" x="846" y="128" text-anchor="middle">Bundet lager</text>
  <path d="M800 146 L892 146" stroke="#c3d2cb" stroke-width="2"/>
  <text class="txt xs" x="846" y="176" text-anchor="middle">værdi i langsomme</text>
  <text class="txt xs" x="846" y="194" text-anchor="middle">varer</text>
  <text class="txt s" x="480" y="256" text-anchor="middle">Skriv dem ned én gang om måneden. To tal der bliver brugt, er mere værd end ti der ikke gør.</text>
  <text class="txt cap" x="480" y="336" text-anchor="middle">Fem tal du kan begynde at følge i næste uge</text>
  <text class="txt sub" x="480" y="366" text-anchor="middle">Ingen af dem kræver et dashboard. De kræver at nogen skriver dem ned</text>
</svg>