<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">API polling sammenlignet med webhook</title>
  <desc id="d">Til venstre spørges systemet fire gange, og svaret er nej tre af gangene. Til højre sender systemet selv én besked, netop da ordren bliver betalt.</desc>
  <style>
    .txt   { font-family:'Inter',-apple-system,'Segoe UI',sans-serif; fill:#1a1f25; }
    .h     { font-size:21px; font-weight:600; }
    .s     { font-size:17px; fill:#4a5568; }
    .xs    { font-size:14px; fill:#718096; }
    .cap   { font-size:23px; font-weight:600; }
    .sub   { font-size:18px; fill:#4a5568; }
    .card  { fill:#ffffff; }
    .pane  { fill:#f0f4f2; }
    .box   { fill:#e6d8bd; stroke:#c2ad89; stroke-width:2; }
    .tape  { fill:#cdbb9b; }
    .node  { fill:#f5f7f6; stroke:#c3d2cb; stroke-width:2; }
    .gfill { fill:#1a8a5a; }
    .gtxt  { fill:#1a8a5a; }
    .gstk  { stroke:#1a8a5a; fill:none; }
    .grey  { stroke:#9aa7b0; fill:none; }
    .white { fill:#ffffff; }

    .poll{animation:poll 4s linear infinite}
    .hook{animation:hook 4s ease-in-out infinite}
    @keyframes poll{0%{transform:translateX(0);opacity:1}45%{transform:translateX(126px);opacity:1}55%{opacity:0}100%{opacity:0}}
    @keyframes hook{0%,60%{opacity:0}66%{transform:translateX(0);opacity:1}92%{transform:translateX(126px);opacity:1}100%{opacity:0}}

    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <rect class="card" x="0" y="0" width="960" height="420" rx="16"/>
  <text class="txt h" x="60" y="62">API polling</text>
  <text class="txt xs" x="60" y="82">Du spørger igen og igen</text>
  <path d="M66 104 L216 104" stroke="#e3e9e6" stroke-width="3" fill="none"/>
  <circle class="poll" style="animation-delay:0.0s" cx="66" cy="104" r="6" fill="#9aa7b0"/>
  <text class="txt xs" x="228" y="108">Noget nyt? Nej</text>
  <path d="M66 148 L216 148" stroke="#e3e9e6" stroke-width="3" fill="none"/>
  <circle class="poll" style="animation-delay:0.25s" cx="66" cy="148" r="6" fill="#9aa7b0"/>
  <text class="txt xs" x="228" y="152">Noget nyt? Nej</text>
  <path d="M66 192 L216 192" stroke="#e3e9e6" stroke-width="3" fill="none"/>
  <circle class="poll" style="animation-delay:0.5s" cx="66" cy="192" r="6" fill="#9aa7b0"/>
  <text class="txt xs" x="228" y="196">Noget nyt? Nej</text>
  <path d="M66 236 L216 236" stroke="#e3e9e6" stroke-width="3" fill="none"/>
  <circle class="poll" style="animation-delay:0.75s" cx="66" cy="236" r="6" fill="#9aa7b0"/>
  <text class="txt xs" x="228" y="240">Noget nyt? Ja</text>
  <path d="M480 50 L480 300" stroke="#e3e9e6" stroke-width="2"/>
  <text class="txt h gtxt" x="540" y="62">Webhook</text>
  <text class="txt xs" x="540" y="82">Systemet siger til</text>
  <path d="M546 192 L716 192" stroke="#e3e9e6" stroke-width="3" fill="none"/>
  <circle class="hook gfill" cx="546" cy="192" r="7"/>
  <text class="txt s gtxt" x="730" y="197">Ordren er betalt</text>
  <text class="txt xs" x="540" y="250">Én besked, i det øjeblik det sker.</text>
  <text class="txt xs" x="540" y="270">Ingen tomme opkald imellem.</text>
  <text class="txt cap" x="480" y="336" text-anchor="middle">Webhook i stedet for at spørge hvert femte minut</text>
  <text class="txt sub" x="480" y="366" text-anchor="middle">Polling koster kald og forsinkelse. En webhook kommer i samme sekund, som noget sker</text>
</svg>