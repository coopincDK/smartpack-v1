<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">Reorder point vist på en lagerkurve</title>
  <desc id="d">Lagerbeholdningen falder skråt nedad. Når den rammer den grønne linje ved 420 stk., afgives en ordre, og otte dage senere er lageret fyldt op igen.</desc>
  <style>
    .txt   { font-family:'Inter',-apple-system,'Segoe UI',sans-serif; fill:#1a1f25; }
    .h     { font-size:21px; font-weight:600; }
    .s     { font-size:17px; fill:#4a5568; }
    .xs    { font-size:14px; fill:#718096; }
    .cap   { font-size:23px; font-weight:600; }
    .sub   { font-size:18px; fill:#4a5568; }
    .card  { fill:#ffffff; }
    .pane  { fill:#f0f4f2; }
    .box   { fill:#e6d8bd; stroke:#c2ad89; stroke-width:2; }
    .tape  { fill:#cdbb9b; }
    .node  { fill:#f5f7f6; stroke:#c3d2cb; stroke-width:2; }
    .gfill { fill:#1a8a5a; }
    .gtxt  { fill:#1a8a5a; }
    .gstk  { stroke:#1a8a5a; fill:none; }
    .grey  { stroke:#9aa7b0; fill:none; }
    .white { fill:#ffffff; }

    #dot { animation: fall 8s ease-in-out infinite; }
    #ordr { animation: blink 8s linear infinite; }
    @keyframes fall { 0%{offset-distance:0%} 100%{offset-distance:100%} }
    @keyframes blink { 0%,44%{opacity:0} 50%,66%{opacity:1} 74%,100%{opacity:0} }

    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <rect class="card" x="0" y="0" width="960" height="420" rx="16"/>
  <rect class="pane" x="90" y="52" width="780" height="218" rx="10"/>
  <path class="grey" d="M90 270 L870 270 M90 52 L90 270" stroke="#9aa7b0" stroke-width="2"/>
  <text class="txt xs" x="90" y="42">Antal på lager</text>
  <text class="txt xs" x="866" y="290" text-anchor="end">Tid</text>
  <path class="gstk" d="M90 200 L870 200" stroke-width="2" stroke-dasharray="7 6"/>
  <text class="txt h gtxt" x="878" y="198">420</text>
  <text class="txt xs gtxt" x="878" y="216">bestil nu</text>
  <rect x="90" y="238" width="780" height="32" fill="#1a8a5a" opacity="0.10"/>
  <text class="txt xs gtxt" x="102" y="260">Sikkerhedslager 180</text>
  <path class="grey" d="M90 84 L300 200 L392 246 L392 84 L602 200 L694 246 L694 84 L870 182" stroke="#4a5568" stroke-width="3"/>
  <circle class="gfill" cx="300" cy="200" r="7"/>
  <g id="ordr"><rect class="white" x="246" y="132" width="120" height="30" rx="6" stroke="#1a8a5a" stroke-width="2"/><text class="txt xs gtxt" x="306" y="152" text-anchor="middle">Ordre afgivet</text></g>
  <path d="M300 286 L392 286 M300 280 L300 292 M392 280 L392 292" stroke="#718096" stroke-width="2" fill="none"/>
  <text class="txt xs" x="346" y="308" text-anchor="middle">8 dages leveringstid</text>
  <text class="txt cap" x="480" y="336" text-anchor="middle">Reorder point = (30 stk./dag × 8 dage) + 180 = 420</text>
  <text class="txt sub" x="480" y="366" text-anchor="middle">Når lageret rammer 420, bestiller du. Ikke når hylden ser tynd ud</text>
</svg>