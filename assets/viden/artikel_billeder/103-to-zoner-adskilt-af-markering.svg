<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">Zone picking med tre zoner og et samlepunkt</title>
  <desc id="d">Tre zoner ved siden af hinanden med hver sin plukker der bevæger sig op og ned inde i zonen. Til højre samles delordrerne ét sted før pakning.</desc>
  <style>
    .txt   { font-family:'Inter',-apple-system,'Segoe UI',sans-serif; fill:#1a1f25; }
    .h     { font-size:21px; font-weight:600; }
    .s     { font-size:17px; fill:#4a5568; }
    .xs    { font-size:14px; fill:#718096; }
    .cap   { font-size:23px; font-weight:600; }
    .sub   { font-size:18px; fill:#4a5568; }
    .card  { fill:#ffffff; }
    .pane  { fill:#f0f4f2; }
    .box   { fill:#e6d8bd; stroke:#c2ad89; stroke-width:2; }
    .tape  { fill:#cdbb9b; }
    .node  { fill:#f5f7f6; stroke:#c3d2cb; stroke-width:2; }
    .gfill { fill:#1a8a5a; }
    .gtxt  { fill:#1a8a5a; }
    .gstk  { stroke:#1a8a5a; fill:none; }
    .grey  { stroke:#9aa7b0; fill:none; }
    .white { fill:#ffffff; }

    #p1{animation:z1 6s ease-in-out infinite}
    #p2{animation:z2 6s ease-in-out infinite}
    #p3{animation:z3 6s ease-in-out infinite}
    @keyframes z1{0%,100%{transform:translate(0,0)}50%{transform:translate(0,110px)}}
    @keyframes z2{0%,100%{transform:translate(0,90px)}50%{transform:translate(0,0)}}
    @keyframes z3{0%,100%{transform:translate(0,40px)}50%{transform:translate(0,130px)}}
    .flow{stroke-dasharray:6 8;animation:march 1.4s linear infinite}
    @keyframes march{to{stroke-dashoffset:-28}}

    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <rect class="card" x="0" y="0" width="960" height="420" rx="16"/>
  <rect class="pane" x="60" y="70" width="200" height="200" rx="10"/>
  <text class="txt h" x="160" y="60" text-anchor="middle">Zone A</text>
  <rect x="82" y="90" width="52" height="160" rx="4" fill="#e6d8bd" stroke="#c2ad89" stroke-width="2"/>
  <rect x="186" y="90" width="52" height="160" rx="4" fill="#e6d8bd" stroke="#c2ad89" stroke-width="2"/>
  <rect class="pane" x="290" y="70" width="200" height="200" rx="10"/>
  <text class="txt h" x="390" y="60" text-anchor="middle">Zone B</text>
  <rect x="312" y="90" width="52" height="160" rx="4" fill="#e6d8bd" stroke="#c2ad89" stroke-width="2"/>
  <rect x="416" y="90" width="52" height="160" rx="4" fill="#e6d8bd" stroke="#c2ad89" stroke-width="2"/>
  <rect class="pane" x="520" y="70" width="200" height="200" rx="10"/>
  <text class="txt h" x="620" y="60" text-anchor="middle">Zone C</text>
  <rect x="542" y="90" width="52" height="160" rx="4" fill="#e6d8bd" stroke="#c2ad89" stroke-width="2"/>
  <rect x="646" y="90" width="52" height="160" rx="4" fill="#e6d8bd" stroke="#c2ad89" stroke-width="2"/>
  <g id="p1"><circle cx="150" cy="106" r="11" fill="#1a8a5a"/></g>
  <g id="p2"><circle cx="380" cy="106" r="11" fill="#1a8a5a"/></g>
  <g id="p3"><circle cx="610" cy="106" r="11" fill="#1a8a5a"/></g>
  <rect x="760" y="120" width="140" height="100" rx="10" fill="#ffffff" stroke="#1a8a5a" stroke-width="2"/>
  <text class="txt h gtxt" x="830" y="160" text-anchor="middle">Samles</text>
  <text class="txt xs" x="830" y="182" text-anchor="middle">ét sted</text>
  <text class="txt xs" x="830" y="202" text-anchor="middle">til pakning</text>
  <path class="flow" d="M262 170 L286 170" stroke="#1a8a5a" stroke-width="3" fill="none"/>
  <path fill="#1a8a5a" d="M286 164 L298 170 L286 176 Z"/>
  <path class="flow" d="M492 170 L516 170" stroke="#1a8a5a" stroke-width="3" fill="none"/>
  <path fill="#1a8a5a" d="M516 164 L528 170 L516 176 Z"/>
  <path class="flow" d="M722 170 L746 170" stroke="#1a8a5a" stroke-width="3" fill="none"/>
  <path fill="#1a8a5a" d="M746 164 L758 170 L746 176 Z"/>
  <text class="txt cap" x="480" y="336" text-anchor="middle">Zone picking: hver plukker bliver i sin zone</text>
  <text class="txt sub" x="480" y="366" text-anchor="middle">Ingen går hele hallen igennem. Delordrerne samles ét sted, lige før pakning</text>
</svg>