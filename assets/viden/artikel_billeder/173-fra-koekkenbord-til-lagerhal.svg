<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">De fem faser en webshops lager går igennem</title>
  <desc id="d">En tidslinje med fem punkter: køkkenbord med 0 til 20 ordrer om dagen, første ansatte, specialisering, professionalisering og til sidst struktureret skalering over 800 ordrer om dagen.</desc>
  <style>
    .txt   { font-family:'Inter',-apple-system,'Segoe UI',sans-serif; fill:#1a1f25; }
    .h     { font-size:21px; font-weight:600; }
    .s     { font-size:17px; fill:#4a5568; }
    .xs    { font-size:14px; fill:#718096; }
    .cap   { font-size:23px; font-weight:600; }
    .sub   { font-size:18px; fill:#4a5568; }
    .card  { fill:#ffffff; }
    .pane  { fill:#f0f4f2; }
    .box   { fill:#e6d8bd; stroke:#c2ad89; stroke-width:2; }
    .tape  { fill:#cdbb9b; }
    .node  { fill:#f5f7f6; stroke:#c3d2cb; stroke-width:2; }
    .gfill { fill:#1a8a5a; }
    .gtxt  { fill:#1a8a5a; }
    .gstk  { stroke:#1a8a5a; fill:none; }
    .grey  { stroke:#9aa7b0; fill:none; }
    .white { fill:#ffffff; }

    .ph{animation:ph 12s linear infinite}
    @keyframes ph{0%,7%{fill:#1a8a5a;r:13}11%,100%{fill:#c3d2cb;r:9}}

    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <rect class="card" x="0" y="0" width="960" height="420" rx="16"/>
  <path d="M80 168 L880 168" stroke="#c3d2cb" stroke-width="4"/>
  <circle class="ph" style="animation-delay:0.0s" cx="96" cy="168" r="9" fill="#c3d2cb"/>
  <text class="txt xs gtxt" x="96" y="100" text-anchor="middle">Fase 1</text>
  <text class="txt h" x="96" y="124" text-anchor="middle">Køkkenbord</text>
  <text class="txt s" x="96" y="146" text-anchor="middle">0-20 ordrer/dag</text>
  <text class="txt xs" x="96" y="206" text-anchor="middle">Excel og notesblok</text>
  <circle class="ph" style="animation-delay:2.4s" cx="268" cy="168" r="9" fill="#c3d2cb"/>
  <text class="txt xs gtxt" x="268" y="100" text-anchor="middle">Fase 2</text>
  <text class="txt h" x="268" y="124" text-anchor="middle">Første ansatte</text>
  <text class="txt s" x="268" y="146" text-anchor="middle">20-80</text>
  <text class="txt xs" x="268" y="206" text-anchor="middle">Simpelt WMS ind</text>
  <circle class="ph" style="animation-delay:4.8s" cx="440" cy="168" r="9" fill="#c3d2cb"/>
  <text class="txt xs gtxt" x="440" y="100" text-anchor="middle">Fase 3</text>
  <text class="txt h" x="440" y="124" text-anchor="middle">Specialisering</text>
  <text class="txt s" x="440" y="146" text-anchor="middle">80-250</text>
  <text class="txt xs" x="440" y="206" text-anchor="middle">Zoner og batch</text>
  <circle class="ph" style="animation-delay:7.199999999999999s" cx="612" cy="168" r="9" fill="#c3d2cb"/>
  <text class="txt xs gtxt" x="612" y="100" text-anchor="middle">Fase 4</text>
  <text class="txt h" x="612" y="124" text-anchor="middle">Professionel</text>
  <text class="txt s" x="612" y="146" text-anchor="middle">250-800</text>
  <text class="txt xs" x="612" y="206" text-anchor="middle">Flere lande</text>
  <circle class="ph" style="animation-delay:9.6s" cx="784" cy="168" r="9" fill="#c3d2cb"/>
  <text class="txt xs gtxt" x="784" y="100" text-anchor="middle">Fase 5</text>
  <text class="txt h" x="784" y="124" text-anchor="middle">Struktureret</text>
  <text class="txt s" x="784" y="146" text-anchor="middle">800+</text>
  <text class="txt xs" x="784" y="206" text-anchor="middle">Automatisering</text>
  <text class="txt cap" x="480" y="336" text-anchor="middle">Fem faser, og et beslutningspunkt i hver</text>
  <text class="txt sub" x="480" y="366" text-anchor="middle">Den dyreste fejl er at ansætte folk, før processerne er skrevet ned</text>
</svg>