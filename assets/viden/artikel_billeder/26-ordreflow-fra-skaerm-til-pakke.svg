  <title id="t">Dataflowet i e-handel, otte trin</title>
  <desc id="d">Otte kasser i to rækker viser vejen fra ordre i webshop, over validering, plukopgave, pluk, pakning, statusbesked, ERP og til sidst synkronisering af lagertal.</desc>
