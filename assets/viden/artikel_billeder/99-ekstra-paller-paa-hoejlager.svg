<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">Sikkerhedslager som buffer under lagerkurven</title>
  <desc id="d">En lagerkurve falder ned i et grønt bælte i bunden. Bæltet er sikkerhedslageret på 171 stykker, og det dækker de fem dage leverandøren er forsinket.</desc>
  <style>
    .txt   { font-family:'Inter',-apple-system,'Segoe UI',sans-serif; fill:#1a1f25; }
    .h     { font-size:21px; font-weight:600; }
    .s     { font-size:17px; fill:#4a5568; }
    .xs    { font-size:14px; fill:#718096; }
    .cap   { font-size:23px; font-weight:600; }
    .sub   { font-size:18px; fill:#4a5568; }
    .card  { fill:#ffffff; }
    .pane  { fill:#f0f4f2; }
    .box   { fill:#e6d8bd; stroke:#c2ad89; stroke-width:2; }
    .tape  { fill:#cdbb9b; }
    .node  { fill:#f5f7f6; stroke:#c3d2cb; stroke-width:2; }
    .gfill { fill:#1a8a5a; }
    .gtxt  { fill:#1a8a5a; }
    .gstk  { stroke:#1a8a5a; fill:none; }
    .grey  { stroke:#9aa7b0; fill:none; }
    .white { fill:#ffffff; }

    .late{animation:late 7s ease-in-out infinite}
    @keyframes late{0%,30%{opacity:0}38%,82%{opacity:1}92%,100%{opacity:0}}

    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <rect class="card" x="0" y="0" width="960" height="420" rx="16"/>
  <text class="txt xs" x="90" y="42">Antal på lager</text>
  <rect class="pane" x="90" y="52" width="740" height="218" rx="10"/>
  <rect x="90" y="206" width="740" height="64" fill="#1a8a5a" opacity="0.10"/>
  <path d="M90 270 L830 270 M90 52 L90 270" stroke="#9aa7b0" stroke-width="2" fill="none"/>
  <path d="M90 206 L830 206" stroke="#1a8a5a" stroke-width="2" stroke-dasharray="7 6" fill="none"/>
  <text class="txt h gtxt" x="838" y="204">171</text>
  <text class="txt xs gtxt" x="838" y="222">sikkerheds-</text>
  <text class="txt xs gtxt" x="838" y="238">lager</text>
  <path d="M90 78 L330 206 L330 206 L470 248 L470 78 L720 206 L830 248" stroke="#4a5568" stroke-width="3" fill="none"/>
  <g class="late"><path d="M330 284 L470 284 M330 278 L330 290 M470 278 L470 290" stroke="#c2410c" stroke-width="2" fill="none"/><text class="txt xs" style="fill:#c2410c" x="400" y="308" text-anchor="middle">Leverandøren er 5 dage forsinket. Bufferen dækker</text></g>
  <text class="txt cap" x="480" y="336" text-anchor="middle">Sikkerhedslager = (24 − 15) × 19 = 171 stk.</text>
  <text class="txt sub" x="480" y="366" text-anchor="middle">Maks dagssalg minus normalt dagssalg, gange den længste leveringstid du reelt har haft</text>
</svg>