<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">Hvad en retur koster, post for post</title>
  <desc id="d">Fem omkostningsposter vist som bjælker: returfragt, indgående fragt, modtage- og kontroltid, genemballering og ukuranstab.</desc>
  <style>
    .txt   { font-family:'Inter',-apple-system,'Segoe UI',sans-serif; fill:#1a1f25; }
    .h     { font-size:21px; font-weight:600; }
    .s     { font-size:17px; fill:#4a5568; }
    .xs    { font-size:14px; fill:#718096; }
    .cap   { font-size:23px; font-weight:600; }
    .sub   { font-size:18px; fill:#4a5568; }
    .card  { fill:#ffffff; }
    .pane  { fill:#f0f4f2; }
    .box   { fill:#e6d8bd; stroke:#c2ad89; stroke-width:2; }
    .tape  { fill:#cdbb9b; }
    .node  { fill:#f5f7f6; stroke:#c3d2cb; stroke-width:2; }
    .gfill { fill:#1a8a5a; }
    .gtxt  { fill:#1a8a5a; }
    .gstk  { stroke:#1a8a5a; fill:none; }
    .grey  { stroke:#9aa7b0; fill:none; }
    .white { fill:#ffffff; }

    .seg{animation:pop 7s ease-out infinite}
    @keyframes pop{0%,var(--d){transform:scaleY(0)}100%{transform:scaleY(1)}}

    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <rect class="card" x="0" y="0" width="960" height="420" rx="16"/>
  <text class="txt h" x="60" y="56">Det du betaler per retur</text>
  <text class="txt xs" x="470" y="56">rammer alt lavest eller højest: 60-214 kr.</text>
  <text class="txt s" x="60" y="94">Returfragt, kundens side</text>
  <rect x="470" y="74" width="330" height="26" rx="4" fill="#f0f4f2"/>
  <rect class="seg" style="animation-delay:0.0s;transform-origin:470px 0" x="470" y="74" width="202" height="26" rx="4" fill="#1a8a5a" opacity="0.75"/>
  <text class="txt s" x="818" y="94">0-49 kr.</text>
  <text class="txt s" x="60" y="136">Indgående fragt</text>
  <rect x="470" y="116" width="330" height="26" rx="4" fill="#f0f4f2"/>
  <rect class="seg" style="animation-delay:0.35s;transform-origin:532px 0" x="532" y="116" width="82" height="26" rx="4" fill="#1a8a5a" opacity="0.75"/>
  <text class="txt s" x="818" y="136">15-35 kr.</text>
  <text class="txt s" x="60" y="178">Modtage- og kontroltid, 8-15 min</text>
  <rect x="470" y="158" width="330" height="26" rx="4" fill="#f0f4f2"/>
  <rect class="seg" style="animation-delay:0.7s;transform-origin:635px 0" x="635" y="158" width="144" height="26" rx="4" fill="#1a8a5a" opacity="0.75"/>
  <text class="txt s" x="818" y="178">40-75 kr.</text>
  <text class="txt s" x="60" y="220">Genemballering</text>
  <rect x="470" y="200" width="330" height="26" rx="4" fill="#f0f4f2"/>
  <rect class="seg" style="animation-delay:1.0499999999999998s;transform-origin:491px 0" x="491" y="200" width="41" height="26" rx="4" fill="#1a8a5a" opacity="0.75"/>
  <text class="txt s" x="818" y="220">5-15 kr.</text>
  <text class="txt s" x="60" y="262">Ukuranstab</text>
  <rect x="470" y="242" width="330" height="26" rx="4" fill="#f0f4f2"/>
  <rect class="seg" style="animation-delay:1.4s;transform-origin:470px 0" x="470" y="242" width="165" height="26" rx="4" fill="#1a8a5a" opacity="0.75"/>
  <text class="txt s" x="818" y="262">0-40 kr.</text>
  <text class="txt xs" x="470" y="296" text-anchor="middle">0</text>
  <text class="txt xs" x="552" y="296" text-anchor="middle">20</text>
  <text class="txt xs" x="635" y="296" text-anchor="middle">40</text>
  <text class="txt xs" x="718" y="296" text-anchor="middle">60</text>
  <text class="txt xs" x="800" y="296" text-anchor="middle">80</text>
  <text class="txt xs" x="818" y="296">kr.</text>
  <text class="txt cap" x="480" y="336" text-anchor="middle">En retur koster typisk 60-120 kr., ikke kun fragten</text>
  <text class="txt sub" x="480" y="366" text-anchor="middle">Fragten er det eneste, de fleste kan se i regnskabet. Tiden på lageret er den største post</text>
</svg>