  <rect x="360" y="56" width="150" height="64" rx="8" fill="#f5f7f6" stroke="#c3d2cb" stroke-width="2"/>
  <text class="txt h" x="435.0" y="93.0" text-anchor="middle">Webshop</text>
  <text class="txt h gtxt" x="285" y="50" text-anchor="middle">API</text>
