  <circle class="q gfill" cx="222" cy="88" r="7"/>
  <circle class="a" cx="222" cy="88" r="7" fill="#9aa7b0"/>
  <text class="txt s" x="546" y="94">Du spørger, systemet svarer</text>
  <rect x="60" y="140" width="150" height="64" rx="8" fill="#f5f7f6" stroke="#c3d2cb" stroke-width="2"/>
  <text class="txt h" x="135.0" y="177.0" text-anchor="middle">Dit WMS</text>
  <rect x="360" y="140" width="150" height="64" rx="8" fill="#f5f7f6" stroke="#c3d2cb" stroke-width="2"/>
  <text class="txt h" x="435.0" y="177.0" text-anchor="middle">Webshop</text>
  <text class="txt h gtxt" x="285" y="134" text-anchor="middle">Webhook</text>
  <path d="M216 172 L354 172" stroke="#e3e9e6" stroke-width="3" fill="none"/>
  <circle class="w gfill" cx="222" cy="172" r="7"/>
  <text class="txt s" x="546" y="178">Systemet siger til, når der sker noget</text>
  <rect x="60" y="224" width="150" height="64" rx="8" fill="#f5f7f6" stroke="#c3d2cb" stroke-width="2"/>
  <text class="txt h" x="135.0" y="261.0" text-anchor="middle">Dit WMS</text>
  <rect x="360" y="224" width="150" height="64" rx="8" fill="#f5f7f6" stroke="#c3d2cb" stroke-width="2"/>
  <text class="txt h" x="435.0" y="261.0" text-anchor="middle">Webshop</text>
  <text class="txt h gtxt" x="285" y="218" text-anchor="middle">Filoverførsel</text>
  <path d="M216 256 L354 256" stroke="#e3e9e6" stroke-width="3" fill="none"/>
  <circle class="f gfill" cx="222" cy="256" r="7"/>
  <text class="txt s" x="546" y="262">En fil på et fast tidspunkt</text>
  <text class="txt cap" x="480" y="336" text-anchor="middle">Tre måder systemer kan tale sammen</text>
  <text class="txt sub" x="480" y="366" text-anchor="middle">API er et spørgsmål. Webhook er en besked. Fil er en aftale om et tidspunkt</text>
</svg>