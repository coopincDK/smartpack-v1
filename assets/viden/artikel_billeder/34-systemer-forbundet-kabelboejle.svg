<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">API, webhook og filoverførsel sammenlignet</title>
  <desc id="d">Tre rækker. I den øverste sendes et spørgsmål frem og et svar tilbage. I den midterste kommer beskeden af sig selv. I den nederste sendes en fil på et fast tidspunkt.</desc>
  <style>
    .txt   { font-family:'Inter',-apple-system,'Segoe UI',sans-serif; fill:#1a1f25; }
    .h     { font-size:21px; font-weight:600; }
    .s     { font-size:17px; fill:#4a5568; }
    .xs    { font-size:14px; fill:#718096; }
    .cap   { font-size:23px; font-weight:600; }
    .sub   { font-size:18px; fill:#4a5568; }
    .card  { fill:#ffffff; }
    .pane  { fill:#f0f4f2; }
    .box   { fill:#e6d8bd; stroke:#c2ad89; stroke-width:2; }
    .tape  { fill:#cdbb9b; }
    .node  { fill:#f5f7f6; stroke:#c3d2cb; stroke-width:2; }
    .gfill { fill:#1a8a5a; }
    .gtxt  { fill:#1a8a5a; }
    .gstk  { stroke:#1a8a5a; fill:none; }
    .grey  { stroke:#9aa7b0; fill:none; }
    .white { fill:#ffffff; }

    .q{animation:q 4s ease-in-out infinite}
    .a{animation:a 4s ease-in-out infinite}
    .w{animation:w 4s ease-in-out infinite}
    .f{animation:f 4s ease-in-out infinite}
    @keyframes q{0%{transform:translateX(0);opacity:0}6%{opacity:1}30%{transform:translateX(126px);opacity:1}34%{opacity:0}100%{opacity:0}}
    @keyframes a{0%,36%{opacity:0}40%{transform:translateX(126px);opacity:1}64%{transform:translateX(0);opacity:1}68%,100%{opacity:0}}
    @keyframes w{0%,44%{opacity:0}50%{transform:translateX(126px);opacity:1}74%{transform:translateX(0);opacity:1}80%,100%{opacity:0}}
    @keyframes f{0%,70%{opacity:0}76%{transform:translateX(0);opacity:1}94%{transform:translateX(126px);opacity:1}98%,100%{opacity:0}}

    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <rect class="card" x="0" y="0" width="960" height="420" rx="16"/>
  <rect x="60" y="56" width="150" height="64" rx="8" fill="#f5f7f6" stroke="#c3d2cb" stroke-width="2"/>
