<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">Cross-docking sammenlignet med almindeligt lagerflow</title>
  <desc id="d">Øverst går varen gennem fem trin: modtag, sæt på plads, pluk, pak og send. Nederst går den samme vare direkte fra modtagelse til afsendelse.</desc>
  <style>
    .txt   { font-family:'Inter',-apple-system,'Segoe UI',sans-serif; fill:#1a1f25; }
    .h     { font-size:21px; font-weight:600; }
    .s     { font-size:17px; fill:#4a5568; }
    .xs    { font-size:14px; fill:#718096; }
    .cap   { font-size:23px; font-weight:600; }
    .sub   { font-size:18px; fill:#4a5568; }
    .card  { fill:#ffffff; }
    .pane  { fill:#f0f4f2; }
    .box   { fill:#e6d8bd; stroke:#c2ad89; stroke-width:2; }
    .tape  { fill:#cdbb9b; }
    .node  { fill:#f5f7f6; stroke:#c3d2cb; stroke-width:2; }
    .gfill { fill:#1a8a5a; }
    .gtxt  { fill:#1a8a5a; }
    .gstk  { stroke:#1a8a5a; fill:none; }
    .grey  { stroke:#9aa7b0; fill:none; }
    .white { fill:#ffffff; }

    #cdA { animation: runA 7s linear infinite; }
    #cdB { animation: runB 7s linear infinite; }
    @keyframes runA {
      0%{transform:translateX(0);opacity:0} 4%{opacity:1}
      14%{transform:translateX(150px)} 30%{transform:translateX(150px)}
      44%{transform:translateX(330px)} 60%{transform:translateX(330px)}
      74%{transform:translateX(510px)} 88%{transform:translateX(690px);opacity:1}
      96%{transform:translateX(690px);opacity:0} 100%{transform:translateX(690px);opacity:0}
    }
    @keyframes runB {
      0%{transform:translateX(0);opacity:0} 4%{opacity:1}
      22%{transform:translateX(690px);opacity:1}
      30%{transform:translateX(690px);opacity:0} 100%{transform:translateX(690px);opacity:0}
    }

    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <rect class="card" x="0" y="0" width="960" height="420" rx="16"/>
  <text class="txt h" x="40" y="70">Med lager</text>
  <rect class="pane" x="40" y="86" width="880" height="74" rx="10"/>
  <text class="txt xs" x="97" y="152" text-anchor="middle">Modtag</text>
  <text class="txt xs" x="247" y="152" text-anchor="middle">Sæt på plads</text>
  <text class="txt xs" x="427" y="152" text-anchor="middle">Pluk</text>
  <text class="txt xs" x="607" y="152" text-anchor="middle">Pak</text>
  <text class="txt xs" x="787" y="152" text-anchor="middle">Send</text>
  <path class="grey" d="M137 123 L199 123" stroke="#9aa7b0" stroke-width="2"/>
  <path fill="#9aa7b0" d="M198 118 L207 123 L198 128 Z"/>
  <path class="grey" d="M287 123 L379 123" stroke="#9aa7b0" stroke-width="2"/>
  <path fill="#9aa7b0" d="M378 118 L387 123 L378 128 Z"/>
  <path class="grey" d="M467 123 L559 123" stroke="#9aa7b0" stroke-width="2"/>
  <path fill="#9aa7b0" d="M558 118 L567 123 L558 128 Z"/>
  <path class="grey" d="M647 123 L739 123" stroke="#9aa7b0" stroke-width="2"/>
  <path fill="#9aa7b0" d="M738 118 L747 123 L738 128 Z"/>
  <g id="cdA"><g transform="translate(70,90)"><rect class="box" x="0" y="0" width="54" height="42" rx="4"/><rect class="tape" x="0" y="18.0" width="54" height="6"/></g></g>
  <text class="txt h gtxt" x="40" y="212">Cross-docking</text>
  <rect class="pane" x="40" y="228" width="880" height="74" rx="10"/>
  <text class="txt xs" x="97" y="294" text-anchor="middle">Modtag</text>
  <text class="txt xs" x="787" y="294" text-anchor="middle">Send</text>
  <path class="gstk" d="M132 252 L750 252" stroke-width="3" stroke-dasharray="8 7"/>
  <g id="cdB"><g transform="translate(70,232)"><rect class="box" x="0" y="0" width="54" height="42" rx="4"/><rect class="tape" x="0" y="18.0" width="54" height="6"/></g></g>
  <text class="txt cap" x="480" y="336" text-anchor="middle">Cross-docking: varen kommer aldrig på hylden</text>
  <text class="txt sub" x="480" y="366" text-anchor="middle">Ind ad den ene port og ud ad den anden. Sparer to håndteringer, kræver at ordren er kendt på forhånd</text>
</svg>