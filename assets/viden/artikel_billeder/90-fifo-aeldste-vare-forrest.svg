<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420"
     role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">FIFO: den vare der kom først ind, går først ud</title>
  <desc id="d">En reolgang set fra siden. Kasserne rykker mod venstre. Den ældste kasse i venstre ende forlader lageret først, og en ny kasse kommer ind i højre ende.</desc>
  <style>
    .card  { fill:#ffffff; }
    .lane  { fill:#f0f4f2; }
    .box   { fill:#e6d8bd; stroke:#c2ad89; stroke-width:2; }
    .tape  { fill:#cdbb9b; }
    .seam  { stroke:#c2ad89; stroke-width:2; }
    .txt   { font-family:'Inter',-apple-system,'Segoe UI',sans-serif; fill:#1a1f25; }
    .lbl   { font-size:21px; font-weight:600; }
    .sub   { font-size:18px; fill:#4a5568; }
    .cap   { font-size:23px; font-weight:600; }
    .green { fill:#1a8a5a; }
    .gtxt  { fill:#1a8a5a; }
    .g3    { fill:#718096; }
    #flow  { animation: slide 5s linear infinite; }
    @keyframes slide { from { transform: translateX(0); } to { transform: translateX(-160px); } }
    @media (prefers-reduced-motion: reduce) { #flow { animation: none; } }
  </style>

  <rect class="card" x="0" y="0" width="960" height="420" rx="16"/>

  <!-- overskrifter over reolen -->
  <text class="txt lbl" x="150" y="96" text-anchor="middle">Ældst</text>
  <text class="txt lbl" x="810" y="96" text-anchor="middle">Nyest</text>

  <!-- selve reolgangen -->
  <rect class="lane" x="130" y="120" width="700" height="150" rx="10"/>
  <clipPath id="cut"><rect x="130" y="120" width="700" height="150" rx="10"/></clipPath>
  <g clip-path="url(#cut)">
    <g id="flow">
      <g transform="translate(-10,0)">
        <g class="unit"><rect class="box" x="0"   y="142" width="120" height="106" rx="6"/><rect class="tape" x="0"   y="188" width="120" height="8"/><line class="seam" x1="60" y1="142" x2="60" y2="188"/></g>
        <g class="unit"><rect class="box" x="160" y="142" width="120" height="106" rx="6"/><rect class="tape" x="160" y="188" width="120" height="8"/><line class="seam" x1="220" y1="142" x2="220" y2="188"/></g>
        <g class="unit"><rect class="box" x="320" y="142" width="120" height="106" rx="6"/><rect class="tape" x="320" y="188" width="120" height="8"/><line class="seam" x1="380" y1="142" x2="380" y2="188"/></g>
        <g class="unit"><rect class="box" x="480" y="142" width="120" height="106" rx="6"/><rect class="tape" x="480" y="188" width="120" height="8"/><line class="seam" x1="540" y1="142" x2="540" y2="188"/></g>
        <g class="unit"><rect class="box" x="640" y="142" width="120" height="106" rx="6"/><rect class="tape" x="640" y="188" width="120" height="8"/><line class="seam" x1="700" y1="142" x2="700" y2="188"/></g>
        <g class="unit"><rect class="box" x="800" y="142" width="120" height="106" rx="6"/><rect class="tape" x="800" y="188" width="120" height="8"/><line class="seam" x1="860" y1="142" x2="860" y2="188"/></g>
        <g class="unit"><rect class="box" x="960" y="142" width="120" height="106" rx="6"/><rect class="tape" x="960" y="188" width="120" height="8"/><line class="seam" x1="1020" y1="142" x2="1020" y2="188"/></g>
      </g>
    </g>
  </g>
  <rect x="136" y="138" width="124" height="114" rx="8" fill="none" stroke="#1a8a5a" stroke-width="3" stroke-dasharray="7 6"/>
  <rect x="130" y="120" width="700" height="150" rx="10" fill="none" stroke="#c3d2cb" stroke-width="2"/>

  <!-- ud til venstre -->
  <path class="green" d="M104 195 L46 195 M60 181 L44 195 L60 209 Z" fill="#1a8a5a" stroke="#1a8a5a" stroke-width="6" stroke-linejoin="round"/>
  <text class="txt gtxt lbl" x="44" y="160" >Ud først</text>
  <text class="txt sub"      x="44" y="238">Den der</text>
  <text class="txt sub"      x="44" y="258">stod der</text>
  <text class="txt sub"      x="44" y="278">længst</text>

  <!-- ind fra højre -->
  <path d="M856 195 L914 195 M900 181 L916 195 L900 209 Z" fill="#718096" stroke="#718096" stroke-width="6" stroke-linejoin="round"/>
  <text class="txt lbl g3"  x="856" y="160">Ind</text>
  <text class="txt sub"     x="856" y="238">Nye varer</text>
  <text class="txt sub"     x="856" y="258">sættes</text>
  <text class="txt sub"     x="856" y="278">bagest</text>

  <text class="txt cap" x="480" y="336" text-anchor="middle">FIFO: den vare der kom først ind, går først ud</text>
  <text class="txt sub" x="480" y="366" text-anchor="middle">Sætter du nye varer forrest, bliver de gamle aldrig plukket</text>
</svg>
