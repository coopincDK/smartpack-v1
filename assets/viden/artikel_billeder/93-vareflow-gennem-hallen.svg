<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">U-flow, I-flow og L-flow i en lagerhal</title>
  <desc id="d">Tre planer over en lagerhal ved siden af hinanden. I U-flow løber varen ind og ud ad samme side. I I-flow løber den lige igennem. I L-flow drejer den om hjørnet.</desc>
  <style>
    .txt   { font-family:'Inter',-apple-system,'Segoe UI',sans-serif; fill:#1a1f25; }
    .h     { font-size:21px; font-weight:600; }
    .s     { font-size:17px; fill:#4a5568; }
    .xs    { font-size:14px; fill:#718096; }
    .cap   { font-size:23px; font-weight:600; }
    .sub   { font-size:18px; fill:#4a5568; }
    .card  { fill:#ffffff; }
    .pane  { fill:#f0f4f2; }
    .box   { fill:#e6d8bd; stroke:#c2ad89; stroke-width:2; }
    .tape  { fill:#cdbb9b; }
    .node  { fill:#f5f7f6; stroke:#c3d2cb; stroke-width:2; }
    .gfill { fill:#1a8a5a; }
    .gtxt  { fill:#1a8a5a; }
    .gstk  { stroke:#1a8a5a; fill:none; }
    .grey  { stroke:#9aa7b0; fill:none; }
    .white { fill:#ffffff; }

    .m{stroke-dasharray:10 10;animation:m 1.6s linear infinite}
    @keyframes m{to{stroke-dashoffset:-40}}

    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <rect class="card" x="0" y="0" width="960" height="420" rx="16"/>
  <rect class="pane" x="60" y="88" width="200" height="180" rx="10"/>
  <text class="txt h" x="160" y="70" text-anchor="middle">U-flow</text>
  <path class="m gstk" d="M78 250 L78 110 L250 110 L250 250" stroke-width="4"/>
  <text class="txt xs" x="160" y="292" text-anchor="middle">Ind og ud samme side</text>
  <rect class="pane" x="360" y="88" width="200" height="180" rx="10"/>
  <text class="txt h" x="460" y="70" text-anchor="middle">I-flow</text>
  <path class="m gstk" d="M360 180 L560 180" stroke-width="4"/>
  <text class="txt xs" x="460" y="292" text-anchor="middle">Lige igennem hallen</text>
  <rect class="pane" x="660" y="88" width="200" height="180" rx="10"/>
  <text class="txt h" x="760" y="70" text-anchor="middle">L-flow</text>
  <path class="m gstk" d="M660 250 L660 130 L860 130" stroke-width="4"/>
  <text class="txt xs" x="760" y="292" text-anchor="middle">Ind på én side, ud om hjørnet</text>
  <text class="txt xs" x="78" y="266" text-anchor="middle">ind</text>
  <text class="txt xs" x="250" y="266" text-anchor="middle">ud</text>
  <text class="txt xs" x="360" y="168" text-anchor="start">ind</text>
  <text class="txt xs" x="560" y="168" text-anchor="end">ud</text>
  <text class="txt xs" x="660" y="266" text-anchor="middle">ind</text>
  <text class="txt xs" x="860" y="122" text-anchor="middle">ud</text>
  <text class="txt cap" x="480" y="336" text-anchor="middle">Tre måder at lade varerne løbe gennem hallen</text>
  <text class="txt sub" x="480" y="366" text-anchor="middle">U-flow deler porten og sparer plads. I-flow er hurtigst, men kræver to porte</text>
</svg>