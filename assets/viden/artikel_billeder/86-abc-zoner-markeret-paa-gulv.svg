<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">ABC-analyse: få varenumre står for de fleste pluk</title>
  <desc id="d">To vandrette bjælker. Den øverste viser at A-varer kun er 12 procent af varenumrene. Den nederste viser at de samme A-varer står for 71 procent af plukkene.</desc>
  <style>
    .txt   { font-family:'Inter',-apple-system,'Segoe UI',sans-serif; fill:#1a1f25; }
    .h     { font-size:21px; font-weight:600; }
    .s     { font-size:17px; fill:#4a5568; }
    .xs    { font-size:14px; fill:#718096; }
    .cap   { font-size:23px; font-weight:600; }
    .sub   { font-size:18px; fill:#4a5568; }
    .card  { fill:#ffffff; }
    .pane  { fill:#f0f4f2; }
    .box   { fill:#e6d8bd; stroke:#c2ad89; stroke-width:2; }
    .tape  { fill:#cdbb9b; }
    .node  { fill:#f5f7f6; stroke:#c3d2cb; stroke-width:2; }
    .gfill { fill:#1a8a5a; }
    .gtxt  { fill:#1a8a5a; }
    .gstk  { stroke:#1a8a5a; fill:none; }
    .grey  { stroke:#9aa7b0; fill:none; }
    .white { fill:#ffffff; }

    .gw{animation:grow 6s ease-out infinite}
    @keyframes grow{0%{transform:scaleX(0)}18%,100%{transform:scaleX(1)}}

    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <rect class="card" x="0" y="0" width="960" height="420" rx="16"/>
  <text class="txt s" x="60" y="78">Varenumre</text>
  <g class="gw" style="transform-origin:60px 90px"><rect x="60" y="90" width="101" height="46" fill="#1a8a5a" rx="3"/></g>
  <text class="txt" style="font-size:14px;font-weight:600;fill:#ffffff" x="110" y="119" text-anchor="middle">A 12%</text>
  <g class="gw" style="transform-origin:160.8px 90px"><rect x="160.8" y="90" width="218" height="46" fill="#7fb8a0" rx="3"/></g>
  <text class="txt" style="font-size:14px;font-weight:600;fill:#1a1f25" x="270" y="119" text-anchor="middle">B 26%</text>
  <g class="gw" style="transform-origin:379.20000000000005px 90px"><rect x="379.20000000000005" y="90" width="521" height="46" fill="#cfdcd6" rx="3"/></g>
  <text class="txt" style="font-size:14px;font-weight:600;fill:#1a1f25" x="640" y="119" text-anchor="middle">C 62%</text>
  <text class="txt s" x="60" y="188">Pluk</text>
  <g class="gw" style="transform-origin:60px 200px"><rect x="60" y="200" width="596" height="46" fill="#1a8a5a" rx="3"/></g>
  <text class="txt" style="font-size:14px;font-weight:600;fill:#ffffff" x="358" y="229" text-anchor="middle">A 71%</text>
  <g class="gw" style="transform-origin:656.4px 200px"><rect x="656.4" y="200" width="160" height="46" fill="#7fb8a0" rx="3"/></g>
  <text class="txt" style="font-size:14px;font-weight:600;fill:#1a1f25" x="736" y="229" text-anchor="middle">B 19%</text>
  <g class="gw" style="transform-origin:816.0px 200px"><rect x="816.0" y="200" width="84" height="46" fill="#cfdcd6" rx="3"/></g>
  <text class="txt" style="font-size:14px;font-weight:600;fill:#1a1f25" x="858" y="229" text-anchor="middle">C 10%</text>
  <text class="txt xs" x="60" y="276">500 varenumre, 10.000 pluk om måneden. De 60 øverste varenumre står for 7.100 pluk.</text>
  <text class="txt cap" x="480" y="336" text-anchor="middle">ABC: 12% af varenumrene er 71% af plukkene</text>
  <text class="txt sub" x="480" y="366" text-anchor="middle">A-varerne skal stå tættest på pakkebordet. Det alene skærer 15-30% af gangdistancen</text>
</svg>