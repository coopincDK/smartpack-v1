<script>
/* =======================================================================
   TOPSCORE-KILDEN - det eneste der skal rettes for at gaa live
   Saet URL'en til det endpoint der returnerer listen. Svaret maa gerne
   vaere en ren liste eller pakket i {data:[...]} / {scores:[...]} /
   {leaderboard:[...]}. Hvert element skal have et navn og en score;
   felterne maa hedde name/navn/player/user/alias og score/points/point.
   ======================================================================= */
var HIGHSCORE_URL = '/api/spil/topliste?limit=6';   /* dagens topliste, {topliste:[{navn, point}]} */
var ANTAL        = 6;        /* hvor mange der vises */
var HENT_HVER    = 30000;    /* hent ny liste hvert 30. sekund */

/* --- visningsrytme (millisekunder) --- */
var KORT = [
  { id:'k1', tid: 14000 },   /* ren baggrund */
  { id:'k2', tid: 12000 },   /* spil med + QR */
  { id:'k3', tid: 16000 }    /* topscore + QR */
];

/* ---------------- skalering til skaermen ---------------- */
var stage = document.getElementById('stage');
function skaler(){
  var s = Math.min(window.innerWidth/1024, window.innerHeight/384);
  stage.style.transform = 'scale(' + s + ')';
}
window.addEventListener('resize', skaler); skaler();

/* ---------------- baggrundens bevaegelse ---------------- */
var swg = document.querySelector('#sw');
var vm  = document.getElementById('vm');
var glow= document.getElementById('glow');
var bg  = document.getElementById('baseglow');
var LOOP = 91.2, TAU = Math.PI*2, t0 = Date.now();

function render(t){
  var u = (t % (LOOP/2)) / (LOOP/2);
  swg.setAttribute('gradientTransform','translate(' + (-300 + u*1640).toFixed(1) + ',0)');

  var v = (t % LOOP) / LOOP;
  var vx = 362 + 230*Math.sin(TAU*v);   /* holdt omkring midten (buet bord) */
  var vy = 16 + 14*Math.sin(TAU*t/(LOOP/4));
  var vr = -4 + 8*v;
  var vs = 1.00 + 0.06*Math.sin(TAU*t/(LOOP/3));
  vm.setAttribute('transform','translate(' + vx.toFixed(1) + ',' + vy.toFixed(1) +
    ') rotate(' + vr.toFixed(2) + ',150,170) scale(' + vs.toFixed(3) + ')');

  var gx = (512 + 390*Math.sin(TAU*t/(LOOP/4))).toFixed(0);
  var gy = (192 +  70*Math.cos(TAU*t/(LOOP/6))).toFixed(0);
  var hx = (512 - 420*Math.sin(TAU*t/(LOOP/3)+1)).toFixed(0);
  var hy = (192 -  80*Math.cos(TAU*t/(LOOP/5))).toFixed(0);
  glow.style.background =
    'radial-gradient(360px 360px at ' + gx + 'px ' + gy + 'px, rgba(62,207,142,.15), transparent 70%),' +
    'radial-gradient(330px 330px at ' + hx + 'px ' + hy + 'px, rgba(249,115,22,.10), transparent 70%)';

  var dr = (t % (LOOP/4))/(LOOP/8);
  var bx = (dr < 1 ? dr : 2-dr)*(1024+160)-160;
  bg.style.transform = 'translateX(' + bx.toFixed(0) + 'px)';
  bg.style.opacity = 0.42;
}
function loop(){ render((Date.now()-t0)/1000); requestAnimationFrame(loop); }
loop();

/* ---------------- topscore ---------------- */
var scores = [];

function pluk(o, navne){
  for (var i=0;i<navne.length;i++){ if (o[navne[i]] != null) return o[navne[i]]; }
  return null;
}
function normaliser(raw){
  var liste = raw;
  if (!liste) return [];
  if (!(liste instanceof Array)){
    liste = liste.topliste || liste.data || liste.scores || liste.leaderboard || liste.results || liste.items || [];
  }
  if (!(liste instanceof Array)) return [];
  var ud = [];
  for (var i=0;i<liste.length;i++){
    var r = liste[i] || {};
    var n = pluk(r, ['name','navn','player','spiller','user','bruger','alias','nickname']);
    var p = pluk(r, ['score','points','point','best','bedste','value']);
    if (n == null && p == null) continue;
    ud.push({ navn: String(n == null ? '-' : n), point: (p == null ? 0 : p) });
  }
  return ud.slice(0, ANTAL);
}
function tegnListe(){
  var tb = document.getElementById('tbody');
  tb.innerHTML = '';
  for (var i=0;i<scores.length;i++){
    var tr = document.createElement('tr');
    if (i === 0) tr.className = 'top';
    var a = document.createElement('td'); a.className = 'pl'; a.textContent = (i+1) + '.';
    var b = document.createElement('td'); b.className = 'nv'; b.textContent = scores[i].navn;
    var c = document.createElement('td'); c.className = 'po';
    c.textContent = String(scores[i].point).replace(/\B(?=(\d{3})+(?!\d))/g, '.');
    tr.appendChild(a); tr.appendChild(b); tr.appendChild(c);
    tb.appendChild(tr);
  }
}
function hent(){
  if (!HIGHSCORE_URL) return;
  var x = new XMLHttpRequest();
  x.open('GET', HIGHSCORE_URL + (HIGHSCORE_URL.indexOf('?') < 0 ? '?' : '&') + '_=' + Date.now(), true);
  x.timeout = 8000;
  x.onreadystatechange = function(){
    if (x.readyState !== 4) return;
    if (x.status >= 200 && x.status < 300){
      try { scores = normaliser(JSON.parse(x.responseText)); tegnListe(); } catch(e){}
    }
  };
  try { x.send(); } catch(e){}
}
hent();
setInterval(hent, HENT_HVER);

/* ---------------- rytmen ---------------- */
var n = -1;
function naeste(){
  var start = n;
  do {
    n = (n+1) % KORT.length;
    /* spring topscore over naar der ingen liste er - vis aldrig en tom tavle */
    if (KORT[n].id === 'k3' && scores.length === 0) continue;
    break;
  } while (n !== start);

  for (var i=0;i<KORT.length;i++){
    document.getElementById(KORT[i].id).className = 'kort' + (i === n ? ' paa' : '');
  }
  setTimeout(naeste, KORT[n].tid);
}
naeste();
</script>
