# Fase 1-leverance. Udrulning (inkl. binding til 127.0.0.1:8004, nginx,
# certbot) er FASE 2's opgave — se README.md. Bemærk: INGEN publicerede
# porte her, netop fordi fase 2's reverse proxy skal styre adgangen.
version: "3.9"

services:
  api:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      - db
    # Ingen "ports:" her — fase 2 binder til 127.0.0.1:8004 via en ekstern
    # docker-compose.override.yml eller tilsvarende, uden for dette repo.
    volumes:
      # POST /admin/nulstil's pg_dump-sikkerhedsnet (se src/backup.js) skal
      # skrive et sted der overlever selve containeren og som allerede
      # findes/overvåges på serveren — SAMME host-sti som det natlige
      # backup.sh (BACKUP_DIR i backup.sh) skriver til, så alle spil-api-
      # backups (nattens og en evt. nulstillings) samles ét sted for drift.
      - /var/backups/spil-api:/var/backups/spil-api

  db:
    image: postgres:16
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - spil_db_data:/var/lib/postgresql/data
      # Kører KUN ved allerførste opstart (tomt datavolume) — opretter en
      # dedikeret, ikke-superbruger app-rolle. Se scripts/init-db/001-app-role.sh.
      - ./scripts/init-db:/docker-entrypoint-initdb.d:ro
    # Ingen "ports:" her heller — kun `api`-servicen taler med databasen,
    # over det interne docker-netværk.

volumes:
  spil_db_data:
