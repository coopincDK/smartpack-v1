<title>SmartPack vaegskaerm</title>
<style>
  html,body{margin:0;padding:0;height:100%;background:#010E22;overflow:hidden;cursor:none}
  #scene{position:absolute;left:50%;top:50%;width:2048px;height:768px;margin:-384px 0 0 -1024px;
         transform-origin:50% 50%;background:#010E22;overflow:hidden;
         font-family:'Inter Tight','Inter',system-ui,-apple-system,Arial,sans-serif;color:#F1F5F9}
  #moenster{position:absolute;left:0;top:0;z-index:1;pointer-events:none}
  #glow{position:absolute;inset:0;z-index:2;pointer-events:none;
    background:radial-gradient(640px 640px at 1024px 300px, rgba(62,207,142,.13), transparent 70%),
               radial-gradient(520px 520px at 300px 240px, rgba(249,115,22,.08), transparent 70%)}

  #stor{position:absolute;left:0;top:0;width:2048px;height:768px;z-index:8;opacity:0;
        transition:opacity .5s ease;background:#010E22}
  #stor.paa{opacity:1}
  #stor video{display:block;width:2048px;height:768px;object-fit:cover}
  .skaerm{position:absolute;left:0;top:0;width:2048px;z-index:10;opacity:0;
          transition:opacity .45s ease;pointer-events:none}
  .skaerm.paa{opacity:1}

  /* ---------- afspilning ---------- */
  #ramme{position:absolute;overflow:hidden;border-radius:10px;background:#000;
         box-shadow:0 18px 60px -20px rgba(0,0,0,.9), 0 0 0 1px rgba(241,245,249,.10)}
  #ramme video,#ramme iframe{display:block;width:100%;height:100%;border:0;object-fit:cover}
  #info{position:absolute}
  #navn{font-weight:700;letter-spacing:-.025em;line-height:1.02}
  #branche{font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:#3ECF8E}
  #pointe{font-weight:500;color:#94A3B8;line-height:1.3}
  #logoA{position:absolute;right:48px;opacity:.96}
  #mini{position:absolute}
  #minitxt{position:absolute;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:#94A3B8}
  #bjaelke{position:absolute;left:0;height:4px;background:rgba(62,207,142,.18)}
  #bjaelkefyld{height:100%;width:0;background:linear-gradient(90deg,#3ECF8E,#BFFFE2)}

  /* ---------- valgskaerm ---------- */
  #logoB{position:absolute;left:48px;opacity:.96}
  #overskrift{position:absolute;font-weight:700;letter-spacing:-.02em;line-height:1.05}
  #overskrift em{font-style:normal;color:#3ECF8E}
  #hjaelp{position:absolute;font-weight:500;color:#94A3B8}
  .kort{box-sizing:border-box;text-align:center;
        display:flex;flex-direction:column;align-items:center}
  .kort > *{flex:0 0 auto}
  .kort .knavn{font-weight:700;letter-spacing:-.01em;line-height:1.1}
  .kort .kbranche{font-weight:600;letter-spacing:.10em;text-transform:uppercase;color:#3ECF8E;line-height:1.1}
  .kort .kqr{background:#fff;border-radius:12px;display:flex;align-items:center;justify-content:center}
  .kort .kqr img{display:block;image-rendering:pixelated}
  .kort .kscan{font-weight:600;color:#F97316;line-height:1.1}
  #nedtael{position:absolute;left:0;height:4px;background:rgba(241,245,249,.08)}
  #nedtaelfyld{height:100%;width:100%;background:linear-gradient(90deg,#F97316,#3ECF8E)}

  #start{position:absolute;inset:0;z-index:99;background:rgba(1,14,34,.97);
         display:none;align-items:center;justify-content:center;flex-direction:column;cursor:pointer}
  #start h1{font-size:92px;font-weight:700;letter-spacing:-.03em;margin:0}
  #start p{font-size:34px;color:#94A3B8;margin:18px 0 0}
</style>

var H = 768 - SKJULT_BUND;
var scene = document.getElementById('scene');
function tilpas(){
  var s = Math.min(window.innerWidth/2048, window.innerHeight/768);
  scene.style.transform = 'translate(0,0) scale(' + s + ')';
}
window.addEventListener('resize', tilpas); tilpas();

document.getElementById('fadeR').setAttribute('height', 768 - Math.max(0, H - 150));

/* ---------- maal der afhaenger af den synlige hoejde ---------- */
var M = Math.min(Math.round(H * 0.055), 44);
var BAR = 6;                                   /* plads til bjaelken nederst */
var NYT = H - BAR;                             /* nyttehoejde */

/* afspilning: video til venstre, tekst i midten, tre mini-kort til hoejre */
var MINI_N = 3;
var miniB  = 224, miniGab = 18;
var miniW  = MINI_N*miniB + (MINI_N-1)*miniGab;
var miniX  = 2048 - M - miniW;
var TEKST_MIN = 520, GAB = 64;

/* videoen maa hverken blive hoejere end pladsen eller bredere end budgettet */
var budget = miniX - M - GAB - TEKST_MIN;
var vidB = Math.min(Math.round((NYT - 2*M) * 16/9), budget);
var vidH = Math.round(vidB * 9/16);

var r = document.getElementById('ramme');
r.style.left = M + 'px'; r.style.top = Math.round((NYT - vidH)/2) + 'px';
r.style.width = vidB + 'px'; r.style.height = vidH + 'px';

var tekstTop = Math.max(M, Math.round((NYT - hTekst)/2));

la.style.top = tekstTop + 'px'; la.style.width = logoB_ + 'px';

/* ---------- ét kort: branche, navn, QR, scan ---------- */
function lavKort(c, B, Hc){
  var pad   = Math.round(B*0.08);
  var inder = B - 2*pad;
  var fB = Math.max(11, Math.round(Hc*0.068));
  var fN = Math.max(16, Math.round(Hc*0.120));
  var fS = Math.max(11, Math.round(Hc*0.068));
  var g1 = Math.round(Hc*0.025), g2 = Math.round(Hc*0.045), g3 = Math.round(Hc*0.040);
  var qrp = 10;
  var qr  = Math.min(inder - 2*qrp, Hc - (fB*1.15 + g1 + fN*1.15 + g2 + g3 + fS*1.15) - 2*qrp - 12);
  qr = Math.max(60, Math.round(qr));

  var d = document.createElement('div');
  d.className = 'kort';
  d.style.width = B + 'px'; d.style.height = Hc + 'px';
  d.style.padding = '0 ' + pad + 'px';
  d.innerHTML =
    '<div class="kbranche" style="font-size:' + fB + 'px;width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">' + (c.branche||'') + '</div>' +
    '<div class="knavn" style="font-size:' + fN + 'px;margin:' + g1 + 'px 0 ' + g2 + 'px;width:100%;white-space:nowrap">' + c.navn + '</div>' +
    '<div class="kqr" style="padding:' + qrp + 'px">' +
      '<img src="data:image/png;base64,' + c.qr + '" style="width:' + qr + 'px;height:' + qr + 'px" alt="QR til ' + c.navn + '">' +
    '</div>' +
    '<div class="kscan" style="font-size:' + fS + 'px;margin-top:' + g3 + 'px">Scan</div>';
  return d;
}

function tilpasNavne(holder){
  [].slice.call(holder.querySelectorAll('.knavn')).forEach(function(e){
    var f = parseFloat(e.style.fontSize);
    for (var i=0; i<16 && e.scrollWidth > e.clientWidth; i++){
      f -= 1; e.style.fontSize = f + 'px';
    }
  });
}

function tegnKort(liste){
  var h = document.getElementById('kort'); h.innerHTML = '';
  var n = liste.length, bredde = 2048 / n;
  var top = Math.min(Math.round(H*0.235), 150), hoejde = Math.min(NYT - top - 8, 440);
  liste.forEach(function(c, i){
    var d = lavKort(c, bredde, hoejde);
    d.style.position = 'absolute';
    d.style.left = Math.round(i*bredde) + 'px';
    d.style.top  = top + 'px';
    h.appendChild(d);
  });
  tilpasNavne(h);
}

function tegnMini(liste){
  var h = document.getElementById('mini'); h.innerHTML = '';
  var hoejde = parseInt(h.style.height, 10);
  liste.forEach(function(c, i){
    var d = lavKort(c, miniB, hoejde);
    d.style.position = 'absolute';
    d.style.left = (i*(miniB+miniGab)) + 'px';
    d.style.top = '0px';
    h.appendChild(d);
  });
  tilpasNavne(h);
}

/* ---------- tilstande ---------- */
var sA = document.getElementById('sA'), sB = document.getElementById('sB');
var sidste = [];                 /* senest viste, saa de ikke gentages med det samme */
var nedtaelTimer = null, afspiller = null;

function vis(el){ sA.classList.remove('paa'); sB.classList.remove('paa'); el.classList.add('paa'); }

function vaelgTilfaeldige(n){
  var pulje = CASES.filter(function(c){ return sidste.indexOf(c.id) === -1; });
  if (pulje.length < n) pulje = CASES.slice();
  pulje = pulje.slice();
  for (var i = pulje.length - 1; i > 0; i--){
    var j = Math.floor(Math.random()*(i+1)); var t = pulje[i]; pulje[i] = pulje[j]; pulje[j] = t;
  }
  return pulje.slice(0, Math.min(n, pulje.length));
}

var storVideo = null, storTid = 0;

function visStor(){
  ryd();
  sA.classList.remove('paa'); sB.classList.remove('paa');
  var h = document.getElementById('stor');
  if (!storVideo){
    storVideo = document.createElement('video');
    storVideo.src = PRAESENTATION;
    storVideo.loop = true; storVideo.muted = true; storVideo.playsInline = true;
    storVideo.addEventListener('timeupdate', function(){ storTid = storVideo.currentTime; });
    /* kan filmen ikke hentes, maa vaeggen ikke bare staa sort - saa vises kortene i stedet */
    storVideo.addEventListener('error', function(){
      console.error('Kunne ikke hente ' + PRAESENTATION);
      PRAESENTATION = '';
      visValg(false);
    });
    h.appendChild(storVideo);
  }
  try { storVideo.currentTime = storTid; } catch(e){}
  var p = storVideo.play(); if (p && p.catch) p.catch(function(){});
  h.classList.add('paa');
}

function skjulStor(){
  var h = document.getElementById('stor');
  h.classList.remove('paa');
  if (storVideo){ storTid = storVideo.currentTime; storVideo.pause(); }
}

function visValg(efterCase){
  ryd();
  skjulStor();
  tegnKort(vaelgTilfaeldige(ANTAL_KORT));
  vis(sB);
  var fyld = document.getElementById('nedtaelfyld');
  var tid = efterCase ? VALG_TID : VENTETID;
  var t0 = Date.now();
  fyld.style.width = '100%';
  nedtaelTimer = setInterval(function(){
    var p = 1 - (Date.now()-t0)/tid;
    if (p <= 0){
      clearInterval(nedtaelTimer); nedtaelTimer = null;
      if (PRAESENTATION) visStor(); else spil(naesteCase());
      return;
    }
    fyld.style.width = (p*100).toFixed(2) + '%';
  }, 100);
}

function caseSlut(){ visValg(true); }

function naesteCase(){
  var p = CASES.filter(function(c){ return sidste.indexOf(c.id) === -1; });
  if (!p.length) p = CASES.slice();
  return p[Math.floor(Math.random()*p.length)];
}

function ryd(){
  if (nedtaelTimer){ clearInterval(nedtaelTimer); nedtaelTimer = null; }
  if (afspiller){ clearInterval(afspiller); afspiller = null; }
  document.getElementById('ramme').innerHTML = '';
}

function spil(c){
  if (!c) return visValg(false);
  ryd();
  skjulStor();
  sidste.unshift(c.id); sidste = sidste.slice(0, Math.max(3, Math.floor(CASES.length/2)));
  document.getElementById('branche').textContent = c.branche || '';
  document.getElementById('navn').textContent    = c.navn || '';
  document.getElementById('pointe').textContent  = c.pointe || '';
  var fyld = document.getElementById('bjaelkefyld'); fyld.style.width = '0%';
  tegnMini(vaelgTilfaeldige(MINI_N));
  var r = document.getElementById('ramme');

  if (c.fil){
    var v = document.createElement('video');
    v.src = c.fil; v.autoplay = true; v.playsInline = true; v.controls = false;
    v.addEventListener('ended', caseSlut);
    v.addEventListener('error', caseSlut);
    v.addEventListener('timeupdate', function(){
      if (v.duration) fyld.style.width = (v.currentTime/v.duration*100).toFixed(2) + '%';
    });
    r.appendChild(v);
    v.muted = false;
    var p = v.play();
    if (p && p.catch) p.catch(function(){
      /* browseren naegtede lyd - start uden, og tag lyden paa saa snart den maa */
      v.muted = true;
      v.play().catch(function(){});
    });
  } else if (c.yt){
    var f = document.createElement('iframe');
    f.src = 'https://www.youtube.com/embed/' + c.yt +
            '?autoplay=1&controls=0&rel=0&modestbranding=1&playsinline=1&enablejsapi=1';
    f.allow = 'autoplay; encrypted-media';
    f.setAttribute('frameborder','0');
    r.appendChild(f);
    lytYouTube(f, caseSlut, fyld);
  } else {
    setTimeout(caseSlut, 4000);
  }
  vis(sA);
}

/* YouTube melder tilbage naar klippet er slut */
function lytYouTube(iframe, slut, fyld){
  function send(k, a){
    iframe.contentWindow.postMessage(JSON.stringify({event:'command', func:k, args:a||[]}), '*');
  }
  var klar = setInterval(function(){
    try { iframe.contentWindow.postMessage(JSON.stringify({event:'listening'}), '*'); } catch(e){}
  }, 500);
  function besked(e){
    if (!/youtube\.com$/.test(new URL(e.origin).hostname)) return;
    var d; try { d = JSON.parse(e.data); } catch(err){ return; }
    if (d.event === 'onReady') clearInterval(klar);
    if (d.event === 'infoDelivery' && d.info){
      if (d.info.duration && d.info.currentTime)
        fyld.style.width = (d.info.currentTime/d.info.duration*100).toFixed(2) + '%';
      if (d.info.playerState === 0){ window.removeEventListener('message', besked); clearInterval(klar); slut(); }
    }
  }
  window.addEventListener('message', besked);
  afspiller = klar;
}

/* ---------- oenske fra en telefon ---------- */
/* Vaeggen henter kun et oenske naar den er LEDIG - altsaa naar den enten
   koerer den store film eller staar paa valgskaermen. Spiller den en case,
   roerer den ikke koen, og derfor bliver en case aldrig afbrudt. */
function erLedig(){
  if (document.getElementById('stor').classList.contains('paa')) return true;
  if (sB.classList.contains('paa')) return true;
  return false;
}
function lyt(){
  if (!ONSKE_URL) return;
  setInterval(function(){
    if (!erLedig()) return;
    fetch(ONSKE_URL, {cache:'no-store'}).then(function(r){ return r.json(); }).then(function(d){
      if (!d || !d.case) return;
      var c = CASES.filter(function(x){ return x.id === d.case; })[0];
      if (c) spil(c);
    }).catch(function(){});
  }, SPOERG_HVER);
}

/* test fra adresselinjen: ...#case=danguitar */
function fraHash(){
  var m = /case=([A-Za-z0-9_-]+)/.exec(location.hash);
  if (!m) return null;
  return CASES.filter(function(x){ return x.id === m[1]; })[0] || null;
}

/* ---------- start ---------- */
/* ingen klik-skaerm: siden starter selv.
   Praesentationen koerer uden lyd og maa derfor altid spille af sig selv.
   En case forsoeger foerst MED lyd og falder tilbage til uden, hvis browseren naegter.
   Sker der nogensinde et klik, et tryk eller et tastetryk, er lyden laast op bagefter. */
function start(){
  document.getElementById('start').style.display = 'none';
  var c = fraHash();
  if (c) spil(c); else if (PRAESENTATION) visStor(); else visValg(false);
  lyt();
}
/* Chrome spiller kun med lyd af sig selv, hvis browseren er startet med
   --autoplay-policy=no-user-gesture-required, ELLER hvis nogen har roert
   siden mindst een gang. Vi holder oeje med begge dele. */
var lydLaast = false;
function maaLyd(){
  if (lydLaast) return true;
  if (navigator.userActivation && navigator.userActivation.hasBeenActive) return true;
  return false;
}
function tagLydPaa(){
  var v = document.querySelector('#ramme video');
  if (v && v.muted && !v.ended && maaLyd()){
    v.muted = false;
    var u = v.play(); if (u && u.catch) u.catch(function(){ v.muted = true; v.play().catch(function(){}); });
  }
}
['pointerdown','keydown','touchstart','mousedown','click'].forEach(function(h){
  window.addEventListener(h, function(){
    lydLaast = true;
    if (storVideo) { var q = storVideo.play(); if (q && q.catch) q.catch(function(){}); }
    tagLydPaa();
  }, {passive:true, capture:true});
});
/* vagthund: en skaerm paa en stand maa aldrig staa stille.
   Hvert 3. sekund tjekkes det at det der skal koere, rent faktisk koerer. */
setInterval(function(){
  var storPaa = document.getElementById('stor').classList.contains('paa');
  if (storPaa && storVideo && storVideo.paused){
    storVideo.muted = true;
    var q = storVideo.play(); if (q && q.catch) q.catch(function(){});
  }
  var v = document.querySelector('#ramme video');
  if (v && v.paused && v.currentTime > 0 && !v.ended){
    var w = v.play(); if (w && w.catch) w.catch(function(){ v.muted = true; v.play().catch(function(){}); });
  }
  tagLydPaa();
}, 3000);

if (document.readyState === 'complete') start();
else window.addEventListener('load', start);
window.addEventListener('hashchange', function(){ var c = fraHash(); if (c) spil(c); });
</script>
