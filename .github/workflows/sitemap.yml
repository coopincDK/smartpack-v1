name: Update sitemap lastmod

on:
  push:
    branches: [main]
    paths:
      - '**/*.html'
  workflow_dispatch:

concurrency:
  group: sitemap-lastmod
  cancel-in-progress: false

jobs:
  sitemap:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update sitemap.xml lastmod dates
        run: python3 .github/scripts/update-sitemap-lastmod.py

      - name: Commit sitemap.xml
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add sitemap.xml
          git diff --staged --quiet && echo "No changes to sitemap.xml" || (
            git commit -m "chore: update sitemap lastmod dates [skip ci]"
            git pull --rebase origin main
            git push
          )
