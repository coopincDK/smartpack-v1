name: Opdater viden-lister

on:
  push:
    branches: [main]
    paths:
      - 'viden/**/*.html'
  workflow_dispatch:

concurrency:
  group: viden-lister
  cancel-in-progress: false

jobs:
  lister:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Opdater Nyeste artikler, llms.txt og kategori-index
        run: python3 .github/scripts/opdater-viden-lister.py

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add viden/index.html llms.txt sitemap.xml viden/*/index.html
          git diff --staged --quiet && echo "Ingen aendringer" || (
            git commit -m "chore: opdater viden-lister [skip ci]"
            git pull --rebase origin main
            git push
          )
